<!doctype html><html lang="pl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Claude Akademia — lokalny kurs</title><style>
:root{color-scheme:dark;font-family:system-ui,-apple-system,'Segoe UI',sans-serif;background:#10151c;color:#eff3f6}*{box-sizing:border-box}body{margin:0}header{padding:16px 24px;border-bottom:1px solid #293746;background:#141c25;display:flex;justify-content:space-between;gap:16px;align-items:center}header strong{color:#efd39d}header small{color:#8fa3b8}.layout{display:grid;grid-template-columns:300px 1fr;min-height:calc(100vh - 62px)}aside{border-right:1px solid #293746;background:#141c25;padding:18px;overflow:auto}.lesson{width:100%;display:block;padding:12px;text-align:left;background:transparent;color:#dbe6ef;border:1px solid transparent;border-radius:10px;cursor:pointer;margin:3px 0}.lesson.active{background:#263342;border-color:#617287}.lesson:hover{background:#22303d}.lesson small{display:block;color:#91a1b4;margin-top:3px}main{max-width:1050px;width:100%;margin:0 auto;padding:24px;display:grid;grid-template-rows:auto auto 1fr auto;gap:16px;min-width:0}h1{margin:0 0 6px;font-size:1.6rem}h2{font-size:1.05rem;margin:0 0 10px}h3{margin:22px 0 8px;color:#efd39d}p,li{line-height:1.55}.muted{color:#a9b8c8}.panel{border:1px solid #2a3949;border-radius:14px;background:#19232d;padding:18px}select,textarea,button{font:inherit}select,textarea{width:100%;background:#101922;color:#e7f0f7;border:1px solid #455769;border-radius:9px;padding:11px}textarea{resize:vertical}button{border:0;border-radius:9px;padding:11px 14px;cursor:pointer;background:#e6c388;color:#1b2028;font-weight:650}button:disabled{opacity:.55;cursor:wait}.messages{height:min(48vh,450px);min-height:240px;overflow-y:auto;padding:10px;background:#111922;border-radius:10px;border:1px solid #2b3846}.msg{max-width:90%;white-space:pre-wrap;line-height:1.55;padding:11px 13px;border-radius:12px;margin:8px 0;font-size:.96rem}.user{background:#354656;margin-left:auto}.assistant{background:#202d38}.role{font-weight:bold;font-size:.73rem;color:#d3bb91;margin-bottom:5px}.send{display:grid;gap:8px;margin-top:12px}.bar{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.bar select{width:auto}.info{border-left:3px solid #c5a66e;padding-left:12px}.notes{min-height:65px}.error{color:#ffb6ab}.status{font-size:.8rem;color:#aabccc}.lesson-content section{border-top:1px solid #2d3d4d;margin-top:20px;padding-top:4px}.lesson-content code{background:#0e161e;padding:2px 5px;border-radius:5px}.lesson-content pre{background:#0e161e;padding:12px;border-radius:9px;overflow:auto}.quiz fieldset{border:1px solid #394b5c;border-radius:9px;margin:12px 0;padding:12px}.quiz label,.checklist label{display:block;padding:5px 0}.quiz input,.checklist input{margin-right:8px}.result{font-weight:650;color:#efd39d;margin-left:8px} @media(max-width:800px){.layout{display:block}aside{border-right:0;border-bottom:1px solid #293746;max-height:220px}main{padding:14px}.msg{max-width:100%}}
</style></head><body><header><strong>✦ Claude Akademia</strong><small>Wersja lokalna · SQLite · wielu agentów</small></header><div class="layout"><aside><h2>Program kursu</h2><div id="nav"></div></aside><main><section><h1 id="title">Wczytywanie…</h1><div class="muted" id="subtitle"></div></section><section class="panel"><h2>Twoja lekcja</h2><div class="info lesson-content" id="lessonInfo"></div><div class="bar"><label for="status">Status:</label><select id="status"><option value="not_started">Nie rozpoczęto</option><option value="in_progress">W trakcie</option><option value="completed">Ukończono</option></select><span id="saveStatus" class="status"></span></div><p><label for="notes">Moje notatki</label></p><textarea id="notes" class="notes" placeholder="Zapisz ważne pojęcia, pytania i wnioski..."></textarea><div class="bar"><button id="save">Zapisz postęp i notatki</button></div></section><section class="panel"><h2>Rozmowa z nauczycielem</h2><div class="bar"><label for="agent">Agent:</label><select id="agent"><option value="codex">Codex</option><option value="claude">Claude Code</option><option value="antigravity">Antigravity</option></select></div><p class="muted">Wybór agenta zmienia rozmowę, lecz nie stan lekcji.</p><div class="messages" id="messages" aria-live="polite"></div><div class="send"><textarea id="question" rows="3" placeholder="Zapytaj nauczyciela, np. Rozpocznij lekcję od podstaw i daj mi pierwsze ćwiczenie."></textarea><div class="bar"><button id="send">Wyślij do Codex</button><span id="chatStatus" class="status"></span></div></div></section><footer class="muted">Dane są przechowywane lokalnie. Do odpowiedzi AI wymagane jest działające logowanie Codex i połączenie z usługą modelu.</footer></main></div><script>
const nav=document.querySelector('#nav'),messages=document.querySelector('#messages');let state,selected='00',selectedAgent='codex',sessionSave=Promise.resolve();const $=id=>document.getElementById(id);
const api=async(path,method='GET',data)=>{const r=await fetch(path,{method,headers:{'Content-Type':'application/json'},body:data?JSON.stringify(data):undefined});const j=await r.json();if(!r.ok)throw Error(j.error+(j.detail?' — '+j.detail:''));return j};
const escapeHtml=s=>s.replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const lesson00=`<p><strong>Cel:</strong> przygotujesz i samodzielnie sprawdzisz lokalne środowisko Claude Akademii, rozumiejąc gdzie są dane i jakie są granice bezpieczeństwa.</p><section><h3>1. Diagnoza przed lekcją</h3><p class="muted">Wynik służy do dobrania tempa. Nie wpływa na ukończenie lekcji.</p><form class="quiz" id="diagnosticQuiz"><fieldset><legend>1. Gdzie aplikacja przechowuje postępy?</legend><label><input type="radio" name="q0" value="a">W pamięci przeglądarki</label><label><input type="radio" name="q0" value="b">W lokalnej bazie SQLite</label><label><input type="radio" name="q0" value="c">Na GitHub</label></fieldset><fieldset><legend>2. Pod jakim adresem powinien działać serwer?</legend><label><input type="radio" name="q1" value="a">Na publicznym adresie sieciowym</label><label><input type="radio" name="q1" value="b">Na 127.0.0.1</label><label><input type="radio" name="q1" value="c">Wyłącznie w chmurze</label></fieldset><fieldset><legend>3. Co oznacza oddzielna historia agentów?</legend><label><input type="radio" name="q2" value="a">Każdy agent ma osobną bazę</label><label><input type="radio" name="q2" value="b">Postęp lekcji jest osobny</label><label><input type="radio" name="q2" value="c">Rozmowy są rozdzielone, a postęp wspólny</label></fieldset><button type="submit">Sprawdź diagnozę</button><span class="result" id="diagnosticResult"></span></form></section><section><h3>2. Podstawy</h3><ul><li><strong>Node.js</strong> uruchamia lokalny serwer i API.</li><li><strong>SQLite</strong> zapisuje postęp, wyniki i rozmowy w katalogu <code>data/</code>.</li><li><strong>Adapter agenta</strong> łączy lekcję z Codex, Claude Code albo Antigravity.</li><li><strong>127.0.0.1</strong> ogranicza dostęp do tego komputera. Aplikacja nie ma uwierzytelniania i nie powinna być wystawiana do sieci.</li></ul><h3>Przykład i demonstracja</h3><p>Przed uruchomieniem sprawdź środowisko:</p><pre><code>node --version\nnpm --version\ngit --version\nnpm ci\nnpm test\nnpm start</code></pre><p>Po komunikacie startowym otwórz <code>http://127.0.0.1:4317</code>. Pliki <code>data/*.sqlite</code> są prywatnym stanem lokalnym i nie mogą trafić do Git.</p></section><section><h3>3. Ćwiczenie praktyczne</h3><p>Wykonaj kroki samodzielnie. Odpowiedź modelu nie zalicza ćwiczenia.</p><div class="checklist" id="exerciseChecklist"><label><input type="checkbox">Node.js ma wersję co najmniej 24</label><label><input type="checkbox">Polecenie <code>npm test</code> przechodzi lokalnie</label><label><input type="checkbox">Aplikacja otwiera się pod 127.0.0.1:4317</label><label><input type="checkbox">Potrafię wskazać katalog prywatnej bazy</label><label><input type="checkbox">Sprawdziłem logowanie co najmniej jednego agenta</label></div><button id="completeExercise" disabled>Zapisz wykonanie ćwiczenia</button><span class="result" id="exerciseResult"></span></section><section><h3>4. Test końcowy</h3><form class="quiz" id="finalQuiz"><fieldset><legend>1. Dlaczego używamy 127.0.0.1?</legend><label><input type="radio" name="q0" value="a">Aby zwiększyć limit modelu</label><label><input type="radio" name="q0" value="b">Aby serwer był dostępny tylko lokalnie</label><label><input type="radio" name="q0" value="c">Aby szyfrować SQLite</label></fieldset><fieldset><legend>2. Co kopiujemy podczas kopii przy wyłączonej aplikacji?</legend><label><input type="radio" name="q1" value="a">Tylko README</label><label><input type="radio" name="q1" value="b">Tylko plik WAL</label><label><input type="radio" name="q1" value="c">Cały katalog data/</label></fieldset><fieldset><legend>3. Co jest wspólne dla wszystkich agentów?</legend><label><input type="radio" name="q2" value="a">Postęp i notatki lekcji</label><label><input type="radio" name="q2" value="b">Identyfikator sesji</label><label><input type="radio" name="q2" value="c">Historia rozmowy</label></fieldset><fieldset><legend>4. Kiedy można oznaczyć ćwiczenie jako wykonane?</legend><label><input type="radio" name="q3" value="a">Gdy model napisze „dobrze”</label><label><input type="radio" name="q3" value="b">Po samym otwarciu lekcji</label><label><input type="radio" name="q3" value="c">Po wykonaniu wszystkich kryteriów</label></fieldset><button type="submit">Sprawdź test końcowy</button><span class="result" id="finalResult"></span></form><p class="muted">Próg zaliczenia: 3/4. Status „Ukończono” ustawiasz świadomie po wykonaniu ćwiczenia i zaliczeniu testu.</p></section>`;
function assessmentAnswers(form,count){return Array.from({length:count},(_,i)=>form.querySelector(`input[name="q${i}"]:checked`)?.value||'')}
async function submitAssessment(phase,form,count,result){const answers=assessmentAnswers(form,count);if(answers.some(x=>!x)){result.textContent='Odpowiedz na wszystkie pytania.';return}try{const r=await api('/api/assessment','POST',{lesson:'00',phase,answers});result.textContent=`Wynik: ${r.score}/${r.total}${phase==='final'?(r.passed?' — zaliczony':' — powtórz materiał'):''}`;state=await api('/api/state')}catch(e){result.textContent=e.message}}
function renderLesson(){const box=$('lessonInfo');if(selected!=='00'){box.innerHTML='<p>Ten moduł jest na razie konspektem. Kolejne kompletne lekcje powstaną na podstawie zweryfikowanego wzorca modułu 00.</p>';return}box.innerHTML=lesson00;const saved=state.results.find(x=>x.lesson_id==='00');if(saved?.diagnostic_total)$('diagnosticResult').textContent=`Ostatni wynik: ${saved.diagnostic_score}/${saved.diagnostic_total}`;if(saved?.final_total)$('finalResult').textContent=`Ostatni wynik: ${saved.final_score}/${saved.final_total}${saved.final_score>=3?' — zaliczony':' — powtórz materiał'}`;const checks=[...document.querySelectorAll('#exerciseChecklist input')];if(saved?.exercise_completed){checks.forEach(x=>x.checked=true);$('exerciseResult').textContent='Ćwiczenie wykonane ✓'}const update=()=>{$('completeExercise').disabled=!checks.every(x=>x.checked)};checks.forEach(x=>x.onchange=update);update();$('diagnosticQuiz').onsubmit=e=>{e.preventDefault();submitAssessment('diagnostic',e.currentTarget,3,$('diagnosticResult'))};$('finalQuiz').onsubmit=e=>{e.preventDefault();submitAssessment('final',e.currentTarget,4,$('finalResult'))};$('completeExercise').onclick=async()=>{try{await api('/api/exercise','POST',{lesson:'00',completed:true});$('exerciseResult').textContent='Ćwiczenie wykonane ✓';state=await api('/api/state')}catch(e){$('exerciseResult').textContent=e.message}}}
function drawNav(){nav.innerHTML=state.lessons.map(x=>`<button class="lesson ${x.id===selected?'active':''}" data-id="${x.id}">${x.id} — ${escapeHtml(x.title)}<small>${({not_started:'Do rozpoczęcia',in_progress:'W trakcie',completed:'Ukończono'})[(state.progress.find(p=>p.lesson_id===x.id)||{}).status||'not_started']}</small></button>`).join('');nav.querySelectorAll('[data-id]').forEach(b=>b.onclick=()=>choose(b.dataset.id));}
function saveSession(){const data={lesson:selected,agent:selectedAgent};sessionSave=sessionSave.catch(()=>{}).then(()=>api('/api/session','POST',data));return sessionSave}
async function choose(id){selected=id;const l=state.lessons.find(x=>x.id===id);$('title').textContent=l.id+' — '+l.title;$('subtitle').textContent='Kurs prowadzony po polsku · postępy zapisywane lokalnie';const p=state.progress.find(x=>x.lesson_id===id);$('status').value=p?.status||'not_started';$('notes').value=p?.notes||'';$('saveStatus').textContent='';drawNav();renderLesson();const agent=selectedAgent;saveSession().catch(()=>{});const data=await api('/api/messages?lesson='+encodeURIComponent(id)+'&agent='+encodeURIComponent(agent));if(id!==selected||agent!==selectedAgent)return;messages.innerHTML='';data.messages.forEach(m=>show(m.role,m.content));}
function show(role,content){const el=document.createElement('div');el.className='msg '+role;const label=document.createElement('div');label.className='role';label.textContent=role==='user'?'Ty':'Nauczyciel '+({codex:'Codex',claude:'Claude Code',antigravity:'Antigravity'}[selectedAgent]);const text=document.createElement('div');text.textContent=content;el.append(label,text);messages.append(el);messages.scrollTop=messages.scrollHeight;}
$('save').onclick=async()=>{try{await api('/api/progress','POST',{lesson:selected,status:$('status').value,notes:$('notes').value});state=await api('/api/state');drawNav();$('saveStatus').textContent='Zapisano ✓';}catch(e){$('saveStatus').textContent=e.message}};
$('agent').onchange=()=>{selectedAgent=$('agent').value;$('send').textContent='Wyślij do '+({codex:'Codex',claude:'Claude Code',antigravity:'Antigravity'}[selectedAgent]);$('chatStatus').textContent='';$('chatStatus').classList.remove('error');choose(selected)};
$('send').onclick=async()=>{const msg=$('question').value.trim(),lesson=selected,agent=selectedAgent;if(!msg)return;$('send').disabled=true;$('chatStatus').textContent='Nauczyciel odpowiada…';show('user',msg);try{const r=await api('/api/chat','POST',{lesson,agent,message:msg});if(lesson===selected&&agent===selectedAgent)show('assistant',r.reply);$('question').value='';$('chatStatus').textContent='';}catch(e){if(lesson===selected&&agent===selectedAgent){$('chatStatus').textContent=e.message;$('chatStatus').classList.add('error');}}finally{$('send').disabled=false;}};
api('/api/state').then(s=>{state=s;selected=state.resume?.lesson||'00';selectedAgent=state.resume?.agent||'codex';$('agent').value=selectedAgent;$('send').textContent='Wyślij do '+({codex:'Codex',claude:'Claude Code',antigravity:'Antigravity'}[selectedAgent]);choose(selected)}).catch(e=>$('title').textContent='Błąd uruchamiania: '+e.message);
</script></body></html>
